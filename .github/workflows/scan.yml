name: scan

# GitHub の定期実行（cron）は無料枠だと遅れたり動かないことがあるため、
# 1回の実行の中で約5時間40分、5分おきに判定を繰り返し（朝の計画は毎回、自動候補は15分に1回）、
# 終わる前に自分自身を呼び直す（連鎖）。計画は暗号化 Secret FX_PLANS から読む。
# 他人のプルリクから動く起動条件は付けない（Secret を守るため）。実行ログに値を出さない。
# cron は、連鎖が途切れたときの再開用の保険として残す。
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write  # sent_signals.json などの記録を保存するため
  actions: write   # 次の実行を呼び出すため

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: watch every 5 minutes
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FX_PLANS: ${{ secrets.FX_PLANS }}
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          END=$((SECONDS + 20400))
          [ -f plan_state.json ] || echo "{}" > plan_state.json
          while true; do
            python run_cloud.py || true
            git add sent_signals.json health.json plan_state.json
            git diff --cached --quiet || (git commit -q -m "state" && git pull -q --rebase origin main && git push -q origin main) || true
            WAIT=$((300 - $(date +%s) % 300 + 20))
            [ $((SECONDS + WAIT)) -ge $END ] && break
            sleep $WAIT
          done
      - name: call next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scan.yml --repo "$GITHUB_REPOSITORY"
