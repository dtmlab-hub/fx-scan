# =====================================================================
# 波動エントリー候補スキャナーの設定（v1）
# app/scanner.py はここに書かれた数値だけで判定します。
# 狙い：上位足(H4)の第2波押し目 → 下位足(M15)の転換 → ネックライン抜け（第3波の初動）
# 「atr」は各時間足の ATR（平均的な1本の値幅）の何倍か、という意味。
# =====================================================================

# 監視ペア（Yahoo Finance の「USDJPY=X」形式で取得。無料・APIキー不要）
pairs: [USDJPY, EURUSD, GBPUSD, AUDUSD, GBPJPY, EURJPY]

data:
  m15_period: "60d"    # 15分足は Yahoo の仕様で最大60日
  h1_period: "180d"    # H4 は 1時間足から作る

htf:                   # 上位足 H4
  pivot_left: 3        # 左右何本より高い/安いと「山・谷」とみなすか
  pivot_right: 3       # 右側の本数ぶん確定が遅れる（3本 = 12時間）
  atr_len: 14

ltf:                   # 下位足 M15
  pivot_left: 3
  pivot_right: 3
  atr_len: 14

wave2:                 # 第2波（押し目/戻り目）として認める戻し幅
  fib_min: 0.382
  fib_max: 0.618
  golden_min: 0.5      # 50〜61.8% に入っていたら根拠+1

reversal:
  double_tol_atr: 0.3  # 2つの安値の差がこれ以内なら「ダブルボトム」、上なら「安値切上げ」

entry:
  chase_atr: 0.5       # ネックラインからこれ以上離れて抜けたら後追いとして通知しない
  sl_fib: 0.786        # 損切りは第1波の 78.6% 戻しラインの外（ここまで押したら波のカウント間違いとみなす）
                       # null にすると旧方式（M15 の直近安値の外）に戻る
  sl_buffer_atr: 0.2   # 損切りラインからさらにこれだけ外側
  tp_extension: 1.618  # 本命の利確 TP = 第2波安値 + 第1波の値幅 × これ（第3波目標）
                       # null にすると TP = 第1波の高値（旧方式）。第1波の高値は常に「半分利確の目安」として通知に載る
  min_rr: 2.0          # TP までの RR がこれ未満なら通知しない

score:                 # 根拠の数（rules.yaml の「根拠2つ以上」に対応）
  min_score: 2
  role_reversal_tol_atr: 0.5  # H4 の旧高値/旧安値が第2波の底からこれ以内なら根拠+1（H4 ATR基準）
  round_step_pips: 50         # キリ番の間隔
  round_tol_atr: 0.3          # 第2波の底がキリ番からこれ以内なら根拠+1

watch:                 # リアルタイム監視（app/plan_watch.py が15分に1回動かす。オン/オフは plan_watch.json の scanner）
  message_prefix: "【検証中】"  # ロジック検証中であることを通知の先頭に付ける。不要になったら "" にする

backtest:
  max_hold_bars: 960   # 過去検証で決着を待つ最大本数（M15 × 960 = 10日。第3波は時間がかかるため）
